<?xml version="1.0" encoding="UTF-8"?>
<!-- Cyclauncher — Minimalist banner master (vector)
     Identity: effortless · fast · one-handed
     Palette: cyan #19aeff, magenta #d76cff, lavender #f0b6d3 on near-black #0a0a0c
     Base 1024x500, fully scalable. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19aeff"/>
      <stop offset="1" stop-color="#d76cff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="#0a0a0c"/>

  <!-- Subtle kinetic arc (speed / flow) -->
  <path d="M 60 470 A 420 420 0 0 1 964 470" fill="none" stroke="url(#arcGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 120 470 A 360 360 0 0 1 904 470" fill="none" stroke="#19aeff" stroke-width="1.5" stroke-linecap="round" opacity="0.28"/>

  <!-- Slogan -->
  <text y="196" font-size="36" font-weight="600" letter-spacing="0.5">
    <tspan x="321.5" text-anchor="middle" fill="#19aeff">effortless</tspan>
    <tspan x="434.5" text-anchor="middle" fill="#ffffff" opacity="0.6">·</tspan>
    <tspan x="489" text-anchor="middle" fill="#d76cff">fast</tspan>
    <tspan x="543.5" text-anchor="middle" fill="#ffffff" opacity="0.6">·</tspan>
    <tspan x="679.5" text-anchor="middle" fill="#19aeff">one-handed</tspan>
  </text>

  <!-- Thin divider -->
  <line x1="300" y1="252" x2="724" y2="252" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Feature pillars: minimal line icons + labels -->
  <g fill="none" stroke="#f0b6d3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tag Folders -->
    <g transform="translate(152,300)">
      <path d="M 0 6 L 0 40 L 44 40 L 44 16 L 26 16 L 20 6 Z"/>
    </g>
    <!-- Multi-modal Search -->
    <g transform="translate(312,300)">
      <circle cx="20" cy="20" r="14"/>
      <line x1="30" y1="30" x2="44" y2="44"/>
    </g>
    <!-- Favorites / Highlights -->
    <g transform="translate(472,300)">
      <path d="M 20 40 C 6 30 2 20 8 12 C 13 6 20 8 20 14 C 20 8 27 6 32 12 C 38 20 34 30 20 40 Z"/>
    </g>
    <!-- App Categorization -->
    <g transform="translate(632,300)">
      <rect x="4" y="4" width="16" height="16" rx="3"/>
      <rect x="24" y="4" width="16" height="16" rx="3"/>
      <rect x="4" y="24" width="16" height="16" rx="3"/>
      <rect x="24" y="24" width="16" height="16" rx="3"/>
    </g>
    <!-- Private Space -->
    <g transform="translate(792,300)">
      <path d="M 20 4 L 36 10 L 36 24 C 36 34 29 40 20 44 C 11 40 4 34 4 24 L 4 10 Z"/>
      <rect x="13" y="18" width="14" height="10" rx="2"/>
      <line x1="20" y1="18" x2="20" y2="14"/>
    </g>
  </g>

  <!-- Pillar labels -->
  <g font-size="15" font-weight="500" fill="#8a8a94" text-anchor="middle" letter-spacing="0.5">
    <text x="174" y="372">Tag Folders</text>
    <text x="334" y="372">Search</text>
    <text x="494" y="372">Favorites</text>
    <text x="654" y="372">Categories</text>
    <text x="814" y="372">Private Space</text>
  </g>
</svg>
